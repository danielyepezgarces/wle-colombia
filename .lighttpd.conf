# Lighttpd configuration for Toolforge webservice (PHP runtime)
# Documentation: https://wikitech.wikimedia.org/wiki/Help:Toolforge/Web/Lighttpd

# Enable url rewrite module
server.modules += ( "mod_rewrite" )

# Rewrite /wikidia or /wikidia/ to index.php?edition=wikidia
url.rewrite-once += (
    "^/wikidia/?(\?.*)?$" => "/index.php?edition=wikidia"
)
