[uwsgi]
# ====================================================================
# Wikimedia Toolforge - uWSGI Configuration for Python 3.13
# Wiki Loves Earth Colombia 2026 (wle-colombia)
# ====================================================================

# Directorio de la aplicación (en Toolforge: /data/project/wle-colombia/www/python/src)
chdir = %d/src

# Módulo y callable WSGI
module = app:app

# Gestión de procesos y memoria
master = true
processes = 4
threads = 2
die-on-term = true
vacuum = true
memory-report = true
buffer-size = 65535
max-requests = 5000
reload-on-rss = 256

# Mapeo estático directo en uWSGI para máximo rendimiento
static-map = /css=%d/src/css
static-map = /js=%d/src/js
static-map = /data=%d/src/data
static-map = /vendor=%d/src/vendor
static-expires = /* 86400
